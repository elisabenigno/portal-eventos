<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Eventos Acadêmicos</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Estilo próprio -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <!-- Menu de Navegação -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-danger mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#" onclick="mudarTela('dashboard')">Portal de Eventos</a>
      <div class="navbar-nav">
        <a class="nav-link text-white" href="#" onclick="mudarTela('dashboard')">Dashboard</a>
        <a class="nav-link text-white" href="#" onclick="mudarTela('novo')">Novo Evento</a>
        <a class="nav-link text-white" href="#" onclick="mudarTela('eventos')">Eventos</a>
      </div>
    </div>
  </nav>

  <!-- Conteúdo Principal -->
  <main class="container mb-5">

    <!-- TELA 1: DASHBOARD -->
    <div id="tela-dashboard">
      <h2 class="mb-4">Dashboard</h2>
      <div class="row g-3">
        <div class="col-md-4">
          <div class="card bg-dark text-white p-3">
            <h5>Total de Eventos</h5>
            <p id="total-eventos" class="display-4 mb-0">0</p>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card bg-warning text-dark p-3">
            <h5>Eventos Agendados</h5>
            <p id="total-agendados" class="display-4 mb-0">0</p>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card bg-danger text-white p-3">
            <h5>Eventos Realizados</h5>
            <p id="total-realizados" class="display-4 mb-0">0</p>
          </div>
        </div>
      </div>
    </div>

    <!-- TELA 2: FORMULÁRIO -->
    <div id="tela-novo" style="display: none;">
      <h2 class="mb-4">Cadastrar Novo Evento</h2>
      <div id="mensagem"></div>
      <div class="card p-4">
        <form onsubmit="salvarEvento(event)">
          <div class="mb-3">
            <label class="form-label">Título *</label>
            <input type="text" id="campo-titulo" class="form-control" required>
          </div>
          <div class="row mb-3">
            <div class="col-md-6">
              <label class="form-label">Tipo *</label>
              <select id="campo-tipo" class="form-select" required>
                <option value="">Selecione...</option>
                <option value="Palestra">Palestra</option>
                <option value="Workshop">Workshop</option>
                <option value="Minicurso">Minicurso</option>
                <option value="Visita Técnica">Visita Técnica</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Data *</label>
              <input type="date" id="campo-data" class="form-control" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Local *</label>
            <input type="text" id="campo-local" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Descrição *</label>
            <textarea id="campo-descricao" class="form-control" rows="3" required></textarea>
          </div>
          <button type="submit" class="btn btn-danger">Cadastrar</button>
        </form>
      </div>
    </div>

    <!-- TELA 3: LISTA DE EVENTOS -->
    <div id="tela-eventos" style="display: none;">
      <h2 class="mb-4">Eventos Cadastrados</h2>
      <div class="row g-3 mb-4">
        <div class="col-md-8">
          <input type="text" id="filtro-texto" class="form-control" placeholder="Pesquisar por título..." oninput="desenharLista()">
        </div>
        <div class="col-md-4">
          <select id="filtro-status" class="form-select" onchange="desenharLista()">
            <option value="Todos">Todos os Status</option>
            <option value="Agendado">Agendados</option>
            <option value="Realizado">Realizados</option>
          </select>
        </div>
      </div>
      <div id="area-cards" class="row g-3"></div>
    </div>

  </main>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Arquivo de lógica em JavaScript -->
  <script src="js/app.js"></script>
</body>
</html>
